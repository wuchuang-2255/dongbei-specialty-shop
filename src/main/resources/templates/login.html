<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>登录注册</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="auth"><div class="panel"><h1>登录</h1><p class="error" th:text="${error}"></p><p class="ok" th:text="${message}"></p><form action="/login" method="post" class="form"><input name="username" placeholder="用户名" required><input type="password" name="password" placeholder="密码" required><button>登录</button></form><small>演示用户 demo / demo123　管理员 admin / admin123</small></div><div class="panel"><h1>注册</h1><form action="/register" method="post" class="form"><input name="username" placeholder="用户名" required><input type="password" name="password" placeholder="密码" required><input name="name" placeholder="姓名"><input type="email" name="email" placeholder="邮箱"><input name="phone" placeholder="电话"><input name="address" placeholder="地址"><button>注册</button></form></div></main></body></html>
