<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>购物车</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="narrow"><h1>购物车</h1><div class="panel" th:if="${rows.empty}">购物车还是空的，去首页挑选商品吧。</div><div class="cart-row" th:each="r:${rows}"><img th:src="${r.product.image}"><div><h3 th:text="${r.product.name}">商品</h3><p th:text="'¥'+${r.product.price}">价格</p></div><form th:action="@{/cart/update/{id}(id=${r.product.id})}" method="post"><input type="number" name="qty" min="0" th:value="${r.qty}"><button>更新</button></form><strong th:text="'¥'+${r.subtotal}">小计</strong><form th:action="@{/cart/remove/{id}(id=${r.product.id})}" method="post"><button class="ghost">删除</button></form></div><section class="checkout" th:if="${!rows.empty}"><h2 th:text="'合计 ¥'+${total}">合计</h2><form action="/checkout" method="post" class="form"><input name="receiver" placeholder="收货人" required><input name="phone" placeholder="联系电话" required><input name="address" placeholder="详细收货地址" required><select name="payType"><option>在线支付</option><option>货到付款</option></select><button>提交订单</button></form></section></main></body></html>
