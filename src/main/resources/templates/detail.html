<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>商品详情</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="narrow"><section class="detail"><img th:src="${product.image}"><div><span class="eyebrow" th:text="${product.category}">分类</span><h1 th:text="${product.name}">商品</h1><p th:text="${product.description}">描述</p><strong class="bigprice" th:text="'¥'+${product.price}">价格</strong><p th:text="'当前库存 '+${product.stock}+' 件'">库存</p><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><input type="number" name="qty" value="1" min="1" th:max="${product.stock}"><button>加入购物车</button></form></div></section></main></body></html>
