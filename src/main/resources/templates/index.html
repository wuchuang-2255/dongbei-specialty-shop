<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北境优选 东北地方特色产品销售网站</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header}"></div><main><section class="hero"><div><span class="eyebrow">来自黑土地的日常好味</span><h1>把东北的踏实味道<br>送到你的餐桌</h1><p>精选黑龙江 吉林 辽宁地方特色产品，产地信息清晰，购买流程简单。</p><form action="/" class="search"><input name="q" th:value="${q}" placeholder="搜索大米 木耳 红肠"><button>搜索</button></form></div><div class="hero-mark">东北<br><small>LOCAL GOODS</small></div></section>
<section class="section"><div class="section-title"><div><span>FEATURED</span><h2>东北特色商品</h2></div><p th:text="'共找到 '+${products.size()}+' 件商品'">商品数量</p></div><div class="grid"><article class="card" th:each="p:${products}"><a th:href="@{/product/{id}(id=${p.id})}"><img th:src="${p.image}" th:alt="${p.name}"><div class="badges"><i th:if="${p.hot}">热销</i><i th:if="${p.latest}">新品</i></div><h3 th:text="${p.name}">商品</h3><p th:text="${p.description}">描述</p><div class="price"><strong th:text="'¥'+${p.price}">¥0</strong><span th:text="'库存 '+${p.stock}">库存</span></div></a><form th:action="@{/cart/add/{id}(id=${p.id})}" method="post"><button class="block">加入购物车</button></form></article></div></section></main><footer>北境优选 · JavaWeb 东北地方特色产品销售平台</footer></body></html>
