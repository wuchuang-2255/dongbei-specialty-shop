<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>后台管理</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="wide"><h1>后台管理</h1><section class="admin-grid"><div class="panel"><h2>新增商品</h2><form action="/admin/product/save" method="post" class="form"><input name="name" placeholder="商品名称" required><input name="category" placeholder="分类" required><input name="price" type="number" step="0.01" placeholder="价格" required><input name="stock" type="number" placeholder="库存" required><input name="image" placeholder="图片网址"><textarea name="description" placeholder="商品描述"></textarea><label><input type="checkbox" name="hot"> 热销推荐</label><label><input type="checkbox" name="latest"> 新品推荐</label><button>保存商品</button></form></div><div class="panel stats"><h2>运营概览</h2><p><strong th:text="${products.size()}">0</strong> 件商品</p><p><strong th:text="${orders.size()}">0</strong> 笔订单</p><p><strong th:text="${users.size()}">0</strong> 位用户</p></div></section><h2>商品管理</h2><table><tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>操作</th></tr><tr th:each="p:${products}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.category}"></td><td th:text="${p.price}"></td><td th:text="${p.stock}"></td><td><form th:action="@{/admin/product/delete/{id}(id=${p.id})}" method="post"><button class="danger">删除</button></form></td></tr></table><h2>订单管理</h2><table><tr><th>订单</th><th>用户</th><th>商品</th><th>金额</th><th>状态</th><th>更新</th></tr><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${o.username}"></td><td th:text="${o.items}"></td><td th:text="${o.total}"></td><td th:text="${o.status}"></td><td><form th:action="@{/admin/order/{id}/status(id=${o.id})}" method="post"><select name="status"><option>未付款</option><option>已付款</option><option>配送中</option><option>已完成</option></select><button>更新</button></form></td></tr></table></main></body></html>
