<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>我的订单</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="narrow"><h1>我的订单</h1><article class="order" th:each="o:${orders}"><div><b th:text="'订单 #'+${o.id}">订单</b><span th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm')}">时间</span></div><p th:text="${o.items}">商品</p><p th:text="${o.receiver}+' · '+${o.phone}+' · '+${o.address}">地址</p><div><strong th:text="'¥'+${o.total}">总额</strong><i th:text="${o.status}">状态</i></div></article></main></body></html>
